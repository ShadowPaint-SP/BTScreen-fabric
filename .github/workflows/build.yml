# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Build

on:
  push: 
    paths-ignore:
      - '*.md'
      - '.git*'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: checkout repository
      uses: actions/checkout@v7

    - name: validate gradle wrapper
      uses: gradle/actions/wrapper-validation@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: 25
        distribution: temurin

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: wrapper

    - name: Build with Gradle
      run: chmod +x ./gradlew && ./gradlew build

    - name: Get Gradle Properties
      uses: guillermocalvo/gradle-properties@v3
      id: properties
      with:
        output_file: "${{ github.output }}"

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: build
        path: ./build/libs/*.jar
        compression-level: 0
    
    - name: Create/Move prerelease tag
      uses: jimeh/update-tags-action@v2
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)  # Only runs if this CI was triggered by the default branch
      with:
        tags: "${{ steps.properties.outputs.mod_version }}"

    - name: Create prerelease default
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)  # Only runs if this CI was triggered by the default branch
      uses: softprops/action-gh-release@v3
      with:
        prerelease: true
        name: "v${{ steps.properties.outputs.mod_version }}"
        tag_name: "${{ steps.properties.outputs.mod_version }}"
        files: ./build/libs/*.jar
        generate_release_notes: true
        append_body: false
