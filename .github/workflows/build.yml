# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Build

on:
  push: 
    paths-ignore:
      - '*.md'
      - '.git*'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: checkout repository
      uses: actions/checkout@v4
    - name: validate gradle wrapper
      uses: gradle/actions/wrapper-validation@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: temurin
    - uses: burrunan/gradle-cache-action@v3
      name: Setup Gradle Cache
      with:
        gradle-version: wrapper
        gradle-distribution-sha-256-sum-warning: false

    - name: Build with Gradle
      run: chmod +x ./gradlew && ./gradlew build
    - uses: guillermocalvo/gradle-properties@v3
      id: properties
      with:
        output_file: "${{ github.output }}"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: build
        path: ./build/libs/*.jar
        compression-level: 0
    
    - name: Create/Move prerelease tag
      uses: jimeh/update-tags-action@v1
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)  # Only runs if this CI was triggered by the default branch
      with:
        tags: "${{ steps.properties.outputs.mod_version }}"
    - name: Create prerelease default
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)  # Only runs if this CI was triggered by the default branch
      uses: softprops/action-gh-release@v2
      with:
        prerelease: true
        name: "v${{ steps.properties.outputs.mod_version }}"
        tag_name: "${{ steps.properties.outputs.mod_version }}"
        files: ./build/libs/*.jar
        generate_release_notes: true
    - name: Create prerelease backport
      if: github.ref == 'refs/heads/1.21.4'  # Only runs if backport
      uses: softprops/action-gh-release@v2
      with:
        prerelease: true
        name: "v${{ steps.properties.outputs.mod_version }}"
        tag_name: "${{ steps.properties.outputs.mod_version }}"
        files: ./build/libs/*.jar
